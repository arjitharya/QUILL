name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Groq API key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY repo secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = "app.js";
            const placeholder = "__QUILL_GROQ_API_KEY__";
            const src = fs.readFileSync(path, "utf8");
            if (!src.includes(placeholder)) throw new Error("placeholder not found in app.js");
            fs.writeFileSync(path, src.replace(placeholder, process.env.GROQ_API_KEY));
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
